<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizá tu landing page</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #171a21;
    border: 1px solid #2a2e37;
    border-radius: 16px;
    padding: 32px 28px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }
  p.sub {
    color: #a4a9b3;
    font-size: 14px;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    color: #cfd3da;
    margin: 14px 0 6px;
  }
  input, textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #333844;
    background: #0f1115;
    color: #f2f2f2;
    font-size: 15px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, textarea:focus { outline: none; border-color: #4c8dff; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #25d366;
    color: #06210f;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg {
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    min-height: 18px;
  }
  .msg.ok { color: #25d366; }
  .msg.error { color: #ff6b6b; }
</style>
</head>
<body>
  <div class="card">
    <h1>Contame de tu proyecto</h1>
    <p class="sub">Dejame tus datos y te escribo por WhatsApp en breve con una propuesta para tu landing page.</p>
    <form id="leadForm">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="negocio">Tu negocio o rubro</label>
      <input type="text" id="negocio" name="negocio" placeholder="Ej: curso online, tienda, inmobiliaria" required>

      <label for="telefono">WhatsApp (con código de país)</label>
      <input type="tel" id="telefono" name="telefono" placeholder="+34 600 000 000" required>

      <label for="mensaje">Contame brevemente qué necesitás</label>
      <textarea id="mensaje" name="mensaje" placeholder="Ej: landing para el lanzamiento de mi curso el 10 de septiembre"></textarea>

      <button type="submit" id="submitBtn">Enviar y que me contacten</button>
      <div class="msg" id="formMsg"></div>
    </form>
  </div>

  <script>
    // Reemplazá esta URL por la URL de producción de tu Webhook de n8n
    // (la ves en el nodo "Webhook - Nuevo lead" una vez que activás el workflow)
    const WEBHOOK_URL = "https://julytrade.app.n8n.cloud/webhook/nuevo-lead-landing";

    const form = document.getElementById("leadForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("formMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Enviando...";
      msg.textContent = "";
      msg.className = "msg";

      const payload = {
        nombre: document.getElementById("nombre").value,
        negocio: document.getElementById("negocio").value,
        telefono: document.getElementById("telefono").value,
        mensaje: document.getElementById("mensaje").value,
        origen: window.location.href
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("bad response");
        form.reset();
        msg.textContent = "¡Listo! Te contacto por WhatsApp en breve.";
        msg.className = "msg ok";
      } catch (err) {
        msg.textContent = "Hubo un problema al enviar. Probá de nuevo en un minuto.";
        msg.className = "msg error";
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar y que me contacten";
      }
    });
  </script>
</body>
</html>
